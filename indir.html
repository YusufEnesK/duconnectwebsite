<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DüConnect İndir</title>
    <script>
        (function() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var iosUrl = "https://apps.apple.com/tr/app/d%C3%BCconnect/id6759285150";
            var androidUrl = "https://play.google.com/store/apps/details?id=com.yusufenesksapplication.app&pcampaignid=web_share";
            var fallbackUrl = "index.html#download";

            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.replace(iosUrl);
            } 
            // Android detection
            else if (/android/i.test(userAgent)) {
                window.location.replace(androidUrl);
            } 
            // Desktop or other
            else {
                window.location.replace(fallbackUrl);
            }
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            padding: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3.5px solid rgba(255,255,255,0.15);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { margin-bottom: 12px; font-weight: 800; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.6; }
        .store-links { margin-top: 20px; display: flex; justify-content: center; gap: 16px; }
        a { color: #60a5fa; text-decoration: none; font-weight: 700; background: rgba(255,255,255,0.06); padding: 10px 18px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.1); }
        a:hover { background: rgba(37,99,235,0.3); color: #fff; }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>DüConnect'e Yönlendiriliyorsunuz...</h2>
        <p>Mağaza otomatik açılmazsa cihazınızı seçin:</p>
        <div class="store-links">
            <a href="https://apps.apple.com/tr/app/d%C3%BCconnect/id6759285150">App Store (iOS)</a>
            <a href="https://play.google.com/store/apps/details?id=com.yusufenesksapplication.app&amp;pcampaignid=web_share">Google Play (Android)</a>
        </div>
    </div>
</body>
</html>
